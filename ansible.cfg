[defaults]
inventory      = ./inventory
roles_path     = ./roles
host_key_checking = True
retry_files_enabled = False
vault_password_file = .vault_pass

[ssh_connection]
# accept-new = trust on first use, fail on key change. Lets fresh hosts
# work without manual ssh-keyscan while still blocking MITM after pin.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[connection]
# Send the module over stdin instead of writing it to a temp file and exec'ing
# it in a second ssh round-trip. Two reasons:
#
# 1. It stops the "Module invocation had junk after the JSON data" warning that
#    every task against citadel and warrig produced. Those two are the only
#    hosts with password-gated sudo, so they are the only ones where ansible
#    allocates a pty (-tt) to service the become prompt. A pty translates the
#    module's trailing \n into \r\n, and that stray \r is the "junk" sitting
#    after the JSON. The Pis never showed it because passwordless sudo needs no
#    pty. Cosmetic today, but it is the noise a real failure would hide in.
# 2. It is meaningfully faster, one ssh round-trip per task instead of several.
#
# Requires sudoers WITHOUT `requiretty`, which is the Arch default and verified
# absent on the fleet.
pipelining = True
