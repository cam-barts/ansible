# ansible-pull entrypoint for the Pis (wellerman, black-pearl, billy-of-tea).
# Imports the six playbooks relevant to the Pi fleet so a single pull run
# configures node_exporter, cadvisor, log rotation, ufw, ntfy, and backup
# access in one shot.
#
# Invoke with:
#   ansible-pull -U https://github.com/cam-barts/ansible.git -C stable \
#     -i inventory/ pull/local.yml
#
# `configure_ntfy_client.yml` is `hosts: all` (it's shared with non-Pi
# hosts elsewhere in the repo); when run via ansible-pull on a Pi, the
# `-i inventory/` + the pulling host's own hostname naturally limits `all`
# down to that one host, so no `--limit` is needed here. Not modifying that
# playbook: out of scope for pull/.
#
# NOT USABLE YET. Verified 2026-08-18: none of the three Pis has ansible-pull
# installed (they have git, nothing else), and the `stable` branch this is
# meant to track exists locally but was never pushed, so `-C stable` fails at
# clone. The systemd timer that would schedule it is a third missing piece.
# See "Pull mode (not usable yet)" in the top-level README before relying on
# any of this. The file itself is sound: it passes --syntax-check and every
# playbook it imports runs regularly in push mode.

- name: Import node_exporter deployment
  ansible.builtin.import_playbook: ../playbooks/deploy_node_exporter.yml

- name: Import cAdvisor deployment
  ansible.builtin.import_playbook: ../playbooks/deploy_cadvisor.yml

- name: Import Docker log rotation configuration
  ansible.builtin.import_playbook: ../playbooks/configure_docker_log_rotation.yml

- name: Import UFW configuration
  ansible.builtin.import_playbook: ../playbooks/configure_ufw.yml

- name: Import ntfy client configuration
  ansible.builtin.import_playbook: ../playbooks/configure_ntfy_client.yml

- name: Import backup targets configuration
  ansible.builtin.import_playbook: ../playbooks/configure_backup_targets.yml
