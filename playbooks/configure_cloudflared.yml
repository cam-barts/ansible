---
# The constraint first, because it shapes everything this playbook does and
# doesn't do: cloudflared is not a standalone container. It is a service of the
# BunkerWeb compose project (playbooks/configure_bunkerweb_stack.yml), and it is
# the only inbound path to citadel. Restart it and every externally reachable
# hostname in the lab goes with it, briefly at best.
#
# So this renders config.yml and drops the two credential files in place at the
# modes the tunnel expects (0400 for the credentials JSON, 0600 for the origin
# token). It stops there. No handlers, no restart, no reload. If you change the
# config you reload cloudflared yourself, deliberately, ready to unwedge dockerd
# if it hangs on citadel's loki log driver.
#
#   ansible-playbook --check --diff playbooks/configure_cloudflared.yml
#   ansible-playbook playbooks/configure_cloudflared.yml
#
# Two pieces of this setup are written down rather than managed: the wildcard
# CNAME anchors, and the BunkerWeb -> Grafana -> Windmill auto-ban pipeline.
# roles/cloudflared/README.md explains why for each.
#
# The credential tasks are no_log, so --diff will not print them.

- name: Track citadel's cloudflared tunnel configuration
  hosts: citadel
  gather_facts: false
  # citadel's host_vars sets ansible_become: true for the fleet-wide roles, but
  # nothing here needs root: the compose file and the cloudflared config are all
  # nux-owned, and nux is in the docker group. Dropping it here keeps this play
  # to least privilege and means it needs no become password at all.
  #
  # It has to be the VARIABLE at play level, not `become: false`. A task-level
  # or play-level `become:` keyword loses to the ansible_become host_var (the
  # repo README documents that, and it is what broke ntfy_client on warrig).
  # Play vars outrank inventory host_vars, so setting the variable does work.
  # Verified: `id -un` returns nux.
  vars:
    ansible_become: false
  roles:
    - cloudflared
