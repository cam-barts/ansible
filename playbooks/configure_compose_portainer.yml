---
# Tracks the portainer compose stack byte-faithfully on citadel (the
# portainer agent) and wellerman (the portainer server), and reconciles
# their containers (up -d; -e compose_stack_state=absent brings them
# down). Doctrine: roles/compose_stack/README.md.
#   ansible-playbook --check --diff playbooks/configure_compose_portainer.yml
- name: Track the portainer compose stack
  hosts: citadel:wellerman
  gather_facts: false
  # The VARIABLE, not the become keyword: a play-level `become:` loses to
  # the ansible_become host_var (repo README precedence trap).
  vars:
    ansible_become: false
    compose_stack_name: portainer
  roles:
    - compose_stack
