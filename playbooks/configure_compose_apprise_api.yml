---
# Tracks wellerman's apprise-api compose stack byte-faithfully and reconciles its containers
# to them (up -d; -e compose_stack_state=absent brings it down). Doctrine: roles/compose_stack/README.md.
#   ansible-playbook --check --diff playbooks/configure_compose_apprise_api.yml
- name: Track the apprise-api compose stack
  hosts: wellerman
  gather_facts: false
  # The VARIABLE, not the become keyword: a play-level `become:` loses to
  # the ansible_become host_var (repo README precedence trap).
  vars:
    ansible_become: false
    compose_stack_name: apprise-api
  roles:
    - compose_stack
