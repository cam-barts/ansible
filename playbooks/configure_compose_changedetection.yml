---
# Tracks citadel's changedetection compose stack byte-faithfully and reconciles its containers
# to them (up -d; -e compose_stack_state=absent brings it down). Doctrine: roles/compose_stack/README.md.
#   ansible-playbook --check --diff playbooks/configure_compose_changedetection.yml
- name: Track the changedetection compose stack
  hosts: citadel
  gather_facts: false
  # The VARIABLE, not the become keyword: a play-level `become:` loses to
  # the ansible_become host_var (repo README precedence trap).
  vars:
    ansible_become: false
    compose_stack_name: changedetection
  roles:
    - compose_stack
