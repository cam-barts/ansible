---
# Tracks the portainer_agent compose stack byte-faithfully on every Pi that
# runs one (plus warrig), and reconciles their containers (up -d;
# -e compose_stack_state=absent brings them down). Doctrine:
# roles/compose_stack/README.md.
#   ansible-playbook --check --diff playbooks/configure_compose_portainer_agent.yml
- name: Track the portainer_agent compose stack
  hosts: warrig:black-pearl:billy-of-tea
  gather_facts: false
  # The VARIABLE, not the become keyword: a play-level `become:` loses to
  # the ansible_become host_var (repo README precedence trap).
  vars:
    ansible_become: false
    compose_stack_name: portainer_agent
  roles:
    - compose_stack
