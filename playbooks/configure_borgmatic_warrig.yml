---
# Single play. Installs borgmatic on warrig, renders the config and scripts,
# generates the warrig→gastown SSH key AND authorizes it on gastown, writes the
# vault passphrase, adopts the existing repo, and installs the 04:00 cron entry.
#
# This was two plays until 2026-08-18: warrig first, then a gastown play at the
# end to install the pubkey. That ordering could never complete a first run.
# The role pins root's ssh to the new key with IdentitiesOnly partway through
# play 1, then probes the repo, which dials gastown with a key gastown would
# not accept until play 2. Ansible runs with `-tt`, so the rejected pubkey did
# not fail; sshd fell back to a password prompt and the play hung on it. The
# authorized_key task now lives inside the role, delegated to gastown, and runs
# before anything reaches across.
#
# The reconcile against warrig's previously-unreadable /etc/borgmatic/config.yaml
# is done (2026-08-18); defaults/main.yml carries the real values. A --check
# --diff pass is now optional verification rather than discovery. Note the SSH
# keygen task carries check_mode: false, so even a check run writes the keypair.
#
#   ANSIBLE_ROLES_PATH=./roles ansible-playbook \
#       --ask-become-pass \
#       playbooks/configure_borgmatic_warrig.yml
#
# Before the first real apply, delete the hand-made 04:00 line from root's
# crontab on warrig or the host ends up with two concurrent nightly runs.
# See roles/borgmatic_warrig/README.md.
#
# inventory/hosts (the ansible.cfg default) has warrig in [borgmatic_source],
# so the vault group_vars bind without any -i or -e stacking. gastown must be
# reachable in the same inventory: the role delegates to it by the name
# borgmatic_ssh_remote_host_inventory_name (default "gastown"), which is also
# where its python 3.12 interpreter pin lives.

- name: Configure borgmatic on warrig for daily push to gastown
  hosts: warrig
  become: true
  gather_facts: true
  roles:
    - borgmatic_warrig
