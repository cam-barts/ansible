---
# Puts citadel's BunkerWeb compose file under git and renders it from the
# vaulted secrets. The role writes the file, then dry-runs the stack and fails
# if `docker compose up` would recreate anything.
#
# It refuses on purpose. BunkerWeb fronts every proxied hostname (~48) and the
# cloudflared tunnel is a service in the same compose project, so a recreate
# takes external access to the lab with it. citadel's dockerd also defaults to
# the `loki` log driver, where tearing a container down can deadlock the daemon.
# Nothing here decides to bounce that stack on your behalf.
#
# Expect the guard to fire from time to time without the file having drifted.
# Watchtower keeps cloudflare/cloudflared:latest current for security fixes, and
# each update leaves a stale com.docker.compose.image label behind, which compose
# checks alongside the config hash. roles/bunkerweb_stack/README.md covers it.
#
#   ansible-playbook --check --diff playbooks/configure_bunkerweb_stack.yml
#   ansible-playbook playbooks/configure_bunkerweb_stack.yml
#
# When you do want to reconcile, be at the keyboard with a way to unwedge
# dockerd, and pass:
#   -e bunkerweb_allow_recreate=true
# That only silences the refusal. The role still never runs `up` for you, so the
# actual reconcile is yours to run by hand.
#
# Secrets come from inventory/host_vars/citadel/vault.yml; the template task
# sets diff: false so --diff cannot print them.

- name: Track citadel's BunkerWeb compose stack
  hosts: citadel
  gather_facts: false
  # citadel's host_vars sets ansible_become: true for the fleet-wide roles, but
  # nothing here needs root: the compose file and the cloudflared config are all
  # nux-owned, and nux is in the docker group. Dropping it here keeps this play
  # to least privilege and means it needs no become password at all.
  #
  # It has to be the VARIABLE at play level, not `become: false`. A task-level
  # or play-level `become:` keyword loses to the ansible_become host_var (the
  # repo README documents that, and it is what broke ntfy_client on warrig).
  # Play vars outrank inventory host_vars, so setting the variable does work.
  # Verified: `id -un` returns nux.
  vars:
    ansible_become: false
  roles:
    - bunkerweb_stack
