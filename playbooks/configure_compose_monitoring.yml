---
# Tracks citadel's monitoring compose stack (prometheus, grafana, loki,
# autoheal) byte-faithfully and reconciles its containers
# to them: up -d by default, -e compose_stack_state=absent to
# bring it down. Doctrine: roles/compose_stack/README.md.
#
# This stack was migrated out of Portainer (stack id 13) on 2026-08-19: the
# compose file now lives at /home/nux/docker/monitoring/docker-compose.yml
# and the stale Portainer stack entry must never be redeployed or deleted
# from the Portainer UI (delete would kill these containers).
#
#   ansible-playbook --check --diff playbooks/configure_compose_monitoring.yml
- name: Track the monitoring compose stack
  hosts: citadel
  gather_facts: false
  # The VARIABLE, not the become keyword: a play-level `become:` loses to
  # the ansible_become host_var (repo README precedence trap).
  vars:
    ansible_become: false
    compose_stack_name: monitoring
  roles:
    - compose_stack
