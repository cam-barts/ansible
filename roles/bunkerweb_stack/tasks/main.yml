---
# This role manages the compose FILE and deliberately takes no container
# action. Reconciling citadel's BunkerWeb stack is a human decision (it is the
# sole ingress for ~48 hostnames and carries cloudflared), so there is no
# `state: present` compose task here and there should never be one. See README.

# diff: false so `ansible-playbook --diff` cannot print the rendered secrets.
- name: Template the BunkerWeb compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bunkerweb_stack_dir }}/docker-compose.yml"
    owner: "{{ bunkerweb_stack_file_owner }}"
    group: "{{ bunkerweb_stack_file_group }}"
    mode: "{{ bunkerweb_stack_file_mode }}"
    backup: true
  diff: false

# The guard, same shape as roles/cadvisor: ask the module what it WOULD do, in
# check mode, and refuse rather than let a later run do it. check_mode here
# resolves to `docker compose up --dry-run`, which prints a plan and exits
# without touching the daemon.
#
# Unlike cadvisor this is not gated on the `loki` log driver. The deadlock is
# only half the reason to refuse; the other half is that recreating anything in
# this project drops the Cloudflare tunnel and every proxied hostname, which is
# true on any log driver. Refusing unconditionally is both simpler and safer.
- name: Dry-run the BunkerWeb stack to detect a pending recreate
  community.docker.docker_compose_v2:
    project_src: "{{ bunkerweb_stack_dir }}"
    project_name: "{{ bunkerweb_stack_project }}"
    state: present
  check_mode: true
  diff: true
  changed_when: false
  register: bunkerweb_dry_run
  # `| bool` is load-bearing: see the comment on bunkerweb_allow_recreate in
  # defaults/main.yml. A bare truth test would disarm this guard for
  # `-e bunkerweb_allow_recreate=false` too.
  when: not (bunkerweb_allow_recreate | bool)

- name: Refuse to leave the BunkerWeb stack needing a recreate
  ansible.builtin.fail:
    msg: >-
      `docker compose up` would act on the BunkerWeb stack at
      {{ bunkerweb_stack_dir }}: {{ bunkerweb_dry_run.actions | default([]) }}.
      This stack is the sole ingress for every proxied hostname and carries the
      cloudflared tunnel, and {{ inventory_hostname }}'s dockerd defaults to the
      `loki` log driver where stopping a container can deadlock the daemon.
      Reconcile it by hand, on purpose, with a way to unwedge dockerd.
      The rendered file has been written (previous copy kept as a .bak
      alongside it); only the container reconciliation is refused.
      Set bunkerweb_allow_recreate: true to silence this guard.
  # `.actions`, NOT `.changed`. The dry-run task sets changed_when: false so it
  # never pollutes the play recap, and that also forces `.changed` to False even
  # when compose reports work to do -- measured: a perturbed file produced
  # changed=False with actions=8. Gating on `.changed` would be a guard that can
  # never fire. roles/cadvisor has the same shape, keying on .diff.differences.
  when:
    - not (bunkerweb_allow_recreate | bool)
    - bunkerweb_dry_run.actions | default([]) | length > 0
