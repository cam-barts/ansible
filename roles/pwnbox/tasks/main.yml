# Always want the latest dotfiles HEAD, not a pinned ref.
- name: Clone dotfiles  # noqa: latest[git]
  ansible.builtin.git:
    repo: 'https://github.com/cam-barts/.dotfiles.git'
    dest: "~/.dotfiles"
    update: true

- name: Remove Conflicting Files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.bashrc"
    - "{{ ansible_env.HOME }}/.profile"

# stow's own change status isn't introspectable without added complexity.
- name: Deploy dotfiles via stow  # noqa: no-changed-when
  ansible.builtin.shell: stow -vt ~ */
  args:
    chdir: "{{ ansible_env.HOME }}/.dotfiles"

# Installer script; no get_url/uri equivalent.
- name: Install Starship prompt  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -sS https://starship.rs/install.sh | sh -s -- -b "/usr/local/bin" -y
  args:
    creates: "/usr/local/bin/starship"
  become: true

- name: Install Atuin history tool
  ansible.builtin.shell: bash <(curl --proto '=https' --tlsv1.2 -sSf https://setup.atuin.sh)
  args:
    executable: /bin/bash
    creates: "/usr/local/bin/atuin"
  environment:
    ATUIN_INSTALL_DIR: "/usr/local/bin"
  become: true
