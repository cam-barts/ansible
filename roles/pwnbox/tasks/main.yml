# Always want the latest dotfiles HEAD, not a pinned ref.
- name: Clone dotfiles  # noqa: latest[git]
  ansible.builtin.git:
    repo: 'https://github.com/cam-barts/.dotfiles.git'
    dest: "~/.dotfiles"
    update: true

- name: Remove Conflicting Files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.bashrc"
    - "{{ ansible_env.HOME }}/.profile"

# stow's own change status isn't introspectable without added complexity.
- name: Deploy dotfiles via stow  # noqa: no-changed-when
  ansible.builtin.shell: stow -vt ~ */
  args:
    chdir: "{{ ansible_env.HOME }}/.dotfiles"

# Checksum-pinned release tarballs instead of the upstream curl|sh
# installers: this box sits on the HTB VPN, and those scripts run
# unauthenticated code as root. To bump, take the new version's
# `*-x86_64-unknown-linux-gnu.tar.gz.sha256` from the GitHub release page.
- name: Download Starship release
  ansible.builtin.get_url:
    url: https://github.com/starship/starship/releases/download/v1.26.0/starship-x86_64-unknown-linux-gnu.tar.gz
    dest: /tmp/starship.tar.gz
    checksum: sha256:321f0dd7af8340a5f2e6a8fec6538a04f617486f9ec70d878f91c09cd8deef22
    mode: "0644"

- name: Install Starship prompt
  ansible.builtin.unarchive:
    src: /tmp/starship.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - starship
  become: true

- name: Download Atuin release
  ansible.builtin.get_url:
    url: https://github.com/atuinsh/atuin/releases/download/v18.19.0/atuin-x86_64-unknown-linux-gnu.tar.gz
    dest: /tmp/atuin.tar.gz
    checksum: sha256:4d7559ada42407ee8ddc62349acf134dd297568d032c45a746a7aef8a6860648
    mode: "0644"

- name: Install Atuin history tool
  ansible.builtin.unarchive:
    src: /tmp/atuin.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
    include:
      - atuin-x86_64-unknown-linux-gnu/atuin
  become: true
