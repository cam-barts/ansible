---
# The Docker SDK prereq comes from roles/docker_sdk via meta/main.yml.

- name: Ensure the promtail config directory exists
  ansible.builtin.file:
    path: "{{ promtail_config_dir }}"
    state: directory
    mode: "0755"

- name: Template promtail-config.yml
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ promtail_config_dir }}/promtail-config.yml"
    mode: "0644"

- name: Pull Promtail image
  community.docker.docker_image:
    name: "{{ promtail_image }}:{{ promtail_version }}"
    source: pull

- name: Run Promtail container
  community.docker.docker_container:
    name: "{{ promtail_container_name }}"
  args: "{{ promtail_container_spec }}"
