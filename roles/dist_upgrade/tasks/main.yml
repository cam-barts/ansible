---
- name: Determine target release
  ansible.builtin.set_fact:
    target_release: "{{ release_map[ansible_distribution_release] | default('') }}"

- name: Skip host if already at target or unknown release
  ansible.builtin.meta: end_host
  when: target_release == ''

- name: Display upgrade path
  ansible.builtin.debug:
    msg: "Upgrading {{ inventory_hostname }} from {{ ansible_distribution_release }} to {{ target_release }}"

- name: Backup current system state
  ansible.builtin.import_tasks: backup.yml

- name: Verify DNS resolution
  ansible.builtin.command: host deb.debian.org
  changed_when: false

- name: Verify apt is not locked
  ansible.builtin.shell: fuser /var/lib/dpkg/lock-frontend 2>/dev/null; true
  register: dpkg_lock
  changed_when: false
  failed_when: dpkg_lock.stdout != ''

- name: Update apt sources for target release
  ansible.builtin.import_tasks: sources.yml

- name: Perform distribution upgrade
  ansible.builtin.import_tasks: upgrade.yml

- name: Ensure networking survives reboot
  ansible.builtin.import_tasks: networking.yml

- name: Reboot after dist-upgrade
  ansible.builtin.reboot:
    reboot_timeout: 300
    connect_timeout: 30
    pre_reboot_delay: 2

- name: Verify upgrade succeeded
  ansible.builtin.raw: grep -q "{{ target_release }}" /etc/os-release
  changed_when: false
