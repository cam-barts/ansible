---
# The apt module has no --allow-releaseinfo-change equivalent.
- name: Update apt cache  # noqa: command-instead-of-module
  ansible.builtin.command: apt-get update --allow-releaseinfo-change
  register: apt_update_result
  changed_when: "'Fetched' in apt_update_result.stdout"

- name: Minimal safe upgrade first
  ansible.builtin.apt:
    upgrade: safe
    force_apt_get: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# Apt module has no --allow-downgrades equivalent, needed for Raspbian mirror version quirks.
- name: Full dist-upgrade  # noqa: command-instead-of-module
  ansible.builtin.command: apt-get dist-upgrade -y --allow-downgrades -o Dpkg::Options::=--force-confold -o Dpkg::Options::=--force-confdef
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: dist_upgrade_result
  changed_when: "'0 upgraded' not in dist_upgrade_result.stdout"

# Deliberate: pull in the newest firmware release, not just ensure presence.
- name: Install latest Raspberry Pi firmware  # noqa: package-latest
  ansible.builtin.apt:
    name:
      - raspberrypi-kernel
      - raspberrypi-bootloader
    state: latest
  environment:
    DEBIAN_FRONTEND: noninteractive
  # These package names don't exist on every release; a miss must not abort
  # a half-finished dist-upgrade (restores the old `|| true` semantics).
  failed_when: false

- name: Remove obsolete packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Clean apt cache
  ansible.builtin.apt:
    autoclean: true
