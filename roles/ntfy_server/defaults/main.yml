---
# ntfy server container settings. Mirrors the live /home/pirate/ntfy/
# docker-compose.yml on black-pearl (see README) so the first apply is a
# no-op.
#
# EVERY alert in the lab flows through this server (borgmatic, rsnapshot,
# dsm_config_audit, ...): apply with care. A container recreate is a brief
# alert-delivery outage, not data loss (json-file log driver on black-pearl,
# same as the rest of the Pi fleet: no loki teardown hazard).

ntfy_server_image: binwiederhier/ntfy
ntfy_server_version: v2.11.0
ntfy_server_container_name: ntfy
ntfy_server_restart_policy: unless-stopped

# Directory holding data/ (server.yml + user/auth DBs) and cache/ (web push +
# attachment cache) on the target. Matches the live layout so bind mount
# sources are unchanged.
ntfy_server_dir: /home/pirate/ntfy

# uid:gid the process runs as inside the container (matches the live
# container's `user: 1000:1000`, i.e. the `pirate` account's own uid/gid).
ntfy_server_uid: 1000
ntfy_server_gid: 1000

ntfy_server_timezone: America/New_York
ntfy_server_base_url: https://ntfy.coder.cam
ntfy_server_port: 2867
ntfy_server_network: ntfy_default

# Web Push (background browser notifications). The public key is safe in
# plaintext: it's handed to every subscribing browser by design. The
# private key is a real secret; see README "Secrets".
ntfy_server_web_push_email_address: ntfy@coder.cam
ntfy_server_web_push_public_key: BCqtKJGtjOVEkbyKlEzrfsIWir9Yp2ubXbM-UMV8suP0SEDJ23bNwRl_WdVaA62n8QYb3iW2nUYi844iSOdf_d4
ntfy_server_web_push_private_key: "{{ vault_ntfy_server_web_push_private_key }}"

# Active server.yml settings, read off the live file on black-pearl
# 2026-08-17 (see README: everything else in ntfy's shipped server.yml is
# commented-out defaults, not reproduced here).
ntfy_server_behind_proxy: true
ntfy_server_attachment_cache_dir: /var/cache/ntfy
ntfy_server_attachment_file_size_limit: "50M"
ntfy_server_message_size_limit: "32k"
ntfy_server_visitor_attachment_total_size_limit: "500M"
