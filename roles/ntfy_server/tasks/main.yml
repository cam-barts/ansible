---
# The Docker SDK prereq comes from roles/docker_sdk via meta/main.yml.

- name: Ensure the ntfy data and cache directories exist
  ansible.builtin.file:
    path: "{{ ntfy_server_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - data
    - cache

- name: Template server.yml
  ansible.builtin.template:
    src: server.yml.j2
    dest: "{{ ntfy_server_dir }}/data/server.yml"
    mode: "0644"

- name: Pull ntfy image
  community.docker.docker_image:
    name: "{{ ntfy_server_image }}:{{ ntfy_server_version }}"
    source: pull

- name: Run ntfy container
  community.docker.docker_container:
    name: "{{ ntfy_server_container_name }}"
  args: "{{ ntfy_server_container_spec }}"
