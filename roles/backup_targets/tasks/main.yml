---
# The cache refreshes stay per-manager (cache_valid_time is apt-only and
# update_cache semantics differ), but the install itself is one
# ansible.builtin.package call -- the names are family-independent.

# changed_when: false for the same reason as the pacman sync below. apt
# reports changed whenever it actually refreshes, which cache_valid_time
# delays to once an hour rather than preventing.
- name: Update apt cache (Debian family)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

# changed_when: false because pacman reports `changed` on every db refresh,
# which would make this task permanently noisy without ever indicating that
# anything on the host actually changed.
- name: Sync pacman package db (Archlinux family)
  community.general.pacman:
    update_cache: true
  become: true
  changed_when: false
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install backup-target packages
  ansible.builtin.package:
    name: "{{ backup_target_packages }}"
    state: present
  become: true
