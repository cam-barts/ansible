---
# Prereq: the Docker SDK for Python, required by community.docker modules.
# Only this step needs privilege; the docker_* tasks run as the login user,
# which is expected to be in the `docker` group.

- name: Update apt cache (ignore errors from broken repos)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Install Docker SDK for Python (Debian/Raspbian)
  ansible.builtin.apt:
    name: python3-docker
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install Docker SDK for Python (Archlinux)
  community.general.pacman:
    name: python-docker
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Archlinux"

- name: Pull cAdvisor image
  community.docker.docker_image:
    name: "{{ cadvisor_image }}:{{ cadvisor_version }}"
    source: pull

- name: Run cAdvisor container
  community.docker.docker_container:
    name: "{{ cadvisor_container_name }}"
    image: "{{ cadvisor_image }}:{{ cadvisor_version }}"
    state: started
    restart_policy: "{{ cadvisor_restart_policy }}"
    memory: "{{ cadvisor_memory }}"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    published_ports: "{{ [cadvisor_port ~ ':8080'] if cadvisor_publish_port else omit }}"
    networks: "{{ cadvisor_networks if (cadvisor_networks | length > 0) else omit }}"
    command: "{{ ['--docker_only=true'] if cadvisor_docker_only else omit }}"
