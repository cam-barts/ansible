version: '3'
services:
  blaze-server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    environment:
      TRUST_PROXY: 1
    restart: unless-stopped
    # ports:
    #   - 3030:3030

  blaze-client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    restart: unless-stopped
    ports:
      - 3032:80
    depends_on:
      - blaze-server
    volumes:
      - ./nginx/compose-nginx.conf:/etc/nginx/nginx.conf
    environment:
      - WS_HOST=ws://blaze-server:3030
      - SERVER_HOST=http://blaze-server:3030
