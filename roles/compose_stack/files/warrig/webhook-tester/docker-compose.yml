services:
  webhook-tester:
    image: ghcr.io/tarampampam/webhook-tester:2.3
    container_name: webhook-tester
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8084:8080"
    volumes:
      - ./data:/data
    environment:
      STORAGE_DRIVER: fs
      FS_STORAGE_DIR: /data
      MAX_REQUESTS: "512"
      SESSION_TTL: 720h
      AUTO_CREATE_SESSIONS: "false"
      PUBLIC_URL_ROOT: https://webhook.coder.cam
    healthcheck:
      test: ["CMD", "/bin/app", "start", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
