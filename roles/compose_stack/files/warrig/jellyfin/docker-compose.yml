services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - 8096:8096
      - 7359:7359/udp
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /home/nux/Videos/metube
        target: /media
        read_only: true
      - type: bind
        source: /home/nux/Videos/ytdl-sub/tv_shows/
        target: /media2
        read_only: true
      - type: bind
        source: /home/nux/Music/grace/
        target: /music/grace
        read_only: true
      - type: bind
        source: /home/nux/Music/sorted/
        target: /music/cam
        # read_only: true
    restart: 'unless-stopped'
    devices:
      - nvidia.com/gpu=all
