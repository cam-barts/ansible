services:
  jellyfin:
    image: jellyfin/jellyfin:12.0
    container_name: jellyfin
    user: 1000:1000
    ports:
      - 8096:8096
      - 7359:7359/udp
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /home/nux/Videos/metube
        target: /media
        read_only: true
      - type: bind
        source: /home/nux/Videos/ytdl-sub/tv_shows/
        target: /media2
        read_only: true
      - type: bind
        source: /home/nux/Music/grace/
        target: /music/grace
        read_only: true
      - type: bind
        source: /home/nux/Music/sorted/
        target: /music/cam
        # read_only: true
      - type: bind
        source: /home/nux/data/media
        # /library, NOT /data/media: Jellyfin's duplicate-path check is a naive
        # substring match, so /data/media/* collides with the /media library
        # mount and gets silently dropped from every scan
        target: /library
        read_only: true
      - type: volume
        source: gastown-media
        # NAS cold tier on gastown VideoNet; /cold avoids the substring trap
        target: /cold
        read_only: true
    restart: 'unless-stopped'
    devices:
      - nvidia.com/gpu=all
volumes:
  gastown-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.99,ro,nfsvers=4.1
      device: ":/volume2/VideoNet/media"
