  redis:
    container_name: redis
    image: docker.io/valkey/valkey:7-alpine
    mem_limit: 512m
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "1m"
    #     max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8214:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      # Observatory theme, tracked in Ansible (searxng/ belongs to the container's
      # user, so Ansible cannot write there). A DIRECTORY mount on purpose: a
      # single-file mount pins the old inode when Ansible replaces the file.
      - ./theme:/etc/searxng-theme:ro
    environment:
      - SEARXNG_BASE_URL=https://searx.coder.cam/
      - FORCE_OWNERSHIP=true
    # Observatory theme, re-applied on EVERY container start. SearXNG has no
    # custom-CSS hook, so the theme (./theme/observatory.css, mounted read-only
    # at /etc/searxng-theme) is appended to the image's compiled stylesheet. That edit lives in
    # the container layer, so any recreate (an Ansible play, Watchtower) used to
    # drop it until apply-observatory.sh was run by hand; it was lost that way
    # on 2026-11-16. Doing it here, before the image's entrypoint starts the
    # app, also makes the post-patch restart unnecessary (SearXNG reads static
    # files into memory at startup). The .gz/.br siblings go because they are
    # served in preference to the patched file. Idempotent across restarts.
    # Also patches the engine-label template; see the comment at that step.
    entrypoint:
      - /bin/sh
      - -c
      - |
        d=/usr/local/searxng/searx/static/themes/simple
        if [ -f /etc/searxng-theme/observatory.css ]; then
          for f in sxng-ltr.min.css sxng-rtl.min.css; do
            [ -f "$$d/$$f" ] || continue
            sed -i '/OBSERVATORY_BEGIN/,/OBSERVATORY_END/d' "$$d/$$f"
            # Newline only if the file lacks one (the stock minified CSS does),
            # so restarts do not stack blank lines.
            [ -n "$$(tail -c1 "$$d/$$f")" ] && printf '\n' >> "$$d/$$f"
            { printf '/*__OBSERVATORY_BEGIN__*/\n'
              cat /etc/searxng-theme/observatory.css
              printf '\n/*__OBSERVATORY_END__*/\n'; } >> "$$d/$$f"
            rm -f "$$d/$$f.gz" "$$d/$$f.br"
          done
          echo "observatory theme applied"
        fi
        # Engine label hook (2026-11-17): render each engine as
        # <span data-engine="name"> so the theme can badge results by engine.
        # Karakeep bookmarks link to arbitrary hosts, so unlike NOTE/PODCAST
        # there is no URL to key on. Same container-layer edit as the CSS, so
        # it has to be redone on every start; done before the app boots, so
        # Jinja never caches the unpatched template. Warns rather than exits:
        # a template change upstream should cost the badge, not the search.
        t=/usr/local/searxng/searx/templates/simple/macros.html
        if grep -qF '<span data-engine="{{ engine }}">{{ engine }}</span>' "$$t"; then
          echo "engine label template already patched"
        elif grep -qF '<span>{{ engine }}</span>' "$$t"; then
          sed -i 's|<span>{{ engine }}</span>|<span data-engine="{{ engine }}">{{ engine }}</span>|' "$$t"
          echo "engine label template patched"
        else
          echo "WARNING: engine <span> not found in $$t; BOOKMARK badge will not render" >&2
        fi
        exec /usr/local/searxng/entrypoint.sh
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - CHOWN
    #   - SETGID
    #   - SETUID
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "1m"
    #     max-file: "1"

networks:
  searxng:

volumes:
  caddy-data:
  caddy-config:
  valkey-data2:
