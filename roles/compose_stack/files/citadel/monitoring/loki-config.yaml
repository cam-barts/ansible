auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  # cache_results defaults to false, so the embedded cache below was configured
  # but never consulted: every 5m dashboard refresh re-scanned the full range.
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Loki copies this size into the sibling query_range caches (index_stats,
        # volume, series, label), so the real ceiling is ~5x this. Keep it small.
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 40
  ingestion_burst_size_mb: 60
  reject_old_samples: false
  max_global_streams_per_user: 0
  max_query_length: 0
  max_concurrent_tail_requests: 100
  # citadel has 4 cores; the defaults (32 / 128) oversubscribe the scheduler,
  # which is what turns a slow query into a cancel-storm under load.
  max_query_parallelism: 16
  tsdb_max_query_parallelism: 32
  retention_period: 2160h
  # Per-stream overrides (highest priority wins; selectors match labels only).
  # BunkerWeb is the security history the ban pipeline is audited against, so
  # it outlives the 90d default; chatty app logs nobody reads past two weeks
  # go sooner.
  retention_stream:
    - selector: '{compose_project="bunkerweb"}'
      priority: 2
      period: 4320h
    - selector: '{compose_service=~"windmill_worker.*|sockpuppetbrowser|changedetection"}'
      priority: 1
      period: 336h
  deletion_mode: filter-and-delete

compactor:
  working_directory: /tmp/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_cancel_period: 1h
  delete_request_store: filesystem

ingester:
  # Per-container streams are low-volume, so with the 30m idle default 83% of
  # chunks flushed under 10 KB (~1% of the 1.5 MB target; only 23 of ~5600 ever
  # flushed "full"). Holding them longer means fewer, fuller chunks and fewer
  # index lookups per query. The WAL covers a crash in between.
  chunk_idle_period: 2h
  max_chunk_age: 4h
  # Grafana's best-practice guidance: snappy decompresses much faster than the
  # gzip default at a modest size cost. Old chunks keep gzip and age out.
  chunk_encoding: snappy

ruler:
  alertmanager_url: http://localhost:9093
  # Recording rules (rules/fake/*.yaml, auth disabled => tenant "fake") are
  # evaluated here and remote-written to Prometheus, so dashboards read cheap
  # PromQL instead of rescanning raw BunkerWeb lines on every refresh.
  wal:
    dir: /tmp/loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://prometheus:9090/api/v1/write

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
analytics:
  reporting_enabled: false
