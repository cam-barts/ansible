version: '3.8'

services:
  prometheus:
    user: 1000:1000
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /home/nux/docker/monitoring/prometheus_data:/prometheus
      - /home/nux/docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    mem_limit: 1g
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    user: 1000:1000
    mem_limit: 1g
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /home/nux/docker/monitoring/grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  loki:
    user: 1000:1000
    mem_limit: 1g
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml --pattern-ingester.enabled=true
    volumes:
      - /home/nux/docker/monitoring/loki_data:/tmp/loki
      - /home/nux/docker/monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
