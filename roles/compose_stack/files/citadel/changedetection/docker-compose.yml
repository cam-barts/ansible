services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    volumes:
      - ./data:/datastore
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      - BASE_URL=https://changedetection.coder.cam
      - FETCH_WORKERS=3
      - MINIMUM_SECONDS_RECHECK_TIME=60
    ports:
      - 5000:5000
    depends_on:
      sockpuppetbrowser:
        condition: service_started

  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - MAX_CONCURRENT_CHROME_PROCESSES=5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: loki
      options:
        loki-url: "http://citadel.shadeking.cam.local:3100/loki/api/v1/push"
        mode: "non-blocking"
        loki-retries: "2"
        loki-batch-size: "5000"
        loki-max-backoff: "800ms"
        loki-timeout: "3s"
        keep-file: "true"
        # keep-file WITHOUT these two is the pattern that hoarded 115GB of
        # unrotated logs inside the loki plugin's rootfs. keep-file tells the
        # driver to also write the local json.log, and with no size cap that
        # file never rotates. du misses it unless you pass -x, because it lives
        # behind the plugin mount.
        max-size: "20m"
        max-file: "3"
        loki-pipeline-stages: |
          - drop:
              expression: ".*Failed to connect to the bus.*"
          - drop:
              expression: ".*_request_retry.*"
