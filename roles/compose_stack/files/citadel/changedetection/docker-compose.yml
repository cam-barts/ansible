services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    volumes:
      - ./data:/datastore
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      - BASE_URL=https://changedetection.coder.cam
      - FETCH_WORKERS=3
      - MINIMUM_SECONDS_RECHECK_TIME=60
    ports:
      - 5000:5000
    depends_on:
      sockpuppetbrowser:
        condition: service_started

  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - MAX_CONCURRENT_CHROME_PROCESSES=5
      # server.py defaults LOG_LEVEL to DEBUG (per-CDP-message trace lines);
      # that made this the #2 log source in Loki at ~37 MB/day.
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          memory: 1G
    # json-file, not the loki plugin (Phase 5). Explicit rather than the
    # daemon default so this service is off the plugin whatever order the
    # cutover runs in. Its two drop rules (dbus noise, _request_retry) now
    # live in alloy-journal/config.alloy, scoped to this service.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
