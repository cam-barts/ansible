---
# Borg repo target on gastown. Naming matches warrig's borg_backup_warrig
# convention; gastown→citadel→borg path differentiates the source.
borgmatic_repo_url: "ssh://nux@gastown.shadeking.cam.local/volume1/NetBackup/borg_backup_citadel"

# Local borgmatic config path. Root-owned 0600 because encryption_passcommand
# and DB connection details should not be world-readable.
borgmatic_config_dir: /etc/borgmatic
borgmatic_config_path: "{{ borgmatic_config_dir }}/config.yaml"

# Passphrase. Lives in /etc/borgmatic/passphrase (root 0600), populated from
# the ansible-vault var `vault_borgmatic_passphrase`. encryption_passcommand
# cats it so the secret never lands in the rendered yaml. See README for
# alternatives (secret-tool, Windmill-pulled).
borgmatic_passphrase_file: "{{ borgmatic_config_dir }}/passphrase"
borgmatic_encryption_passcommand: "cat {{ borgmatic_passphrase_file }}"

# SSH key trust citadel→gastown. gastown→citadel was already established for
# rsnapshot pulls; this is the new push direction. Per-cron-job key so the
# regular nux@gastown ssh key doesn't double as the borg push identity.
borgmatic_ssh_key_path: /root/.ssh/borg_gastown
borgmatic_ssh_remote_user: nux
borgmatic_ssh_remote_host: gastown.shadeking.cam.local

# Init marker. Touched after `borgmatic init` (or after `borgmatic info`
# confirms the repo already exists). Guards re-init on subsequent runs.
borgmatic_state_dir: /var/lib/borgmatic
borgmatic_init_marker: "{{ borgmatic_state_dir }}/.initialized"

# System state capture directory. User-owned (nux:nux 0750) under $HOME so
# it rides in the home-dir backup source. Populated by before_backup_command.
borgmatic_system_state_dir: /home/nux/.system-state

# Schedule. Daily 03:00 — offset from warrig's 04:00 so gastown isn't
# servicing two concurrent borg pushes.
borgmatic_cron_hour: 3
borgmatic_cron_minute: 0
borgmatic_cron_user: root

# Sources. /etc and the docker_services tree are the load-bearing state.
# ~/.config selectively included via excludes filter below.
borgmatic_source_directories:
  - /etc
  - /home/nux/docker
  - /home/nux/.config
  - /var/backups/borgmatic-dumps  # populated by before_backup_command
  - "{{ borgmatic_system_state_dir }}"  # populated by before_backup_command

# Exclude patterns. Mirror warrig's pattern (caches, build artifacts, venvs)
# plus citadel-specific: skip Garage object data + metadata (S3 has its own
# replication; config-only is the value), skip windmill worker tmp scratch.
# NOTE: warrig's live exclude list is in root-only /etc/borgmatic/config.yaml.
# Reconcile against `sudo cat /etc/borgmatic/config.yaml` on warrig during
# review and PR-update if there are warrig-specific entries not captured here.
borgmatic_excludes:
  - "*/.cache/*"
  - "*/node_modules/*"
  - "*/__pycache__/*"
  - "*/.venv/*"
  - "*/venv/*"
  - "*/.npm/*"
  - "*/.local/share/Trash/*"
  - "*/tmp/*"
  - "*/.tmp/*"
  # Garage object data + metadata — S3 has internal replication, config is
  # what's worth backing up. Container compose dir itself stays included.
  - "/home/nux/docker/garage/data/*"
  - "/home/nux/docker/garage/meta/*"
  # Loki / Prometheus / Grafana on-disk TSDB chunks — large, derivable from
  # configured scrape targets; backing up config dirs is enough.
  - "/home/nux/docker/monitoring/data/loki/*"
  - "/home/nux/docker/monitoring/data/prometheus/*"
  - "/home/nux/docker/monitoring/data/grafana/grafana.db-journal"
  # changedetection screenshot snapshots — regenerable
  - "/home/nux/docker/changedetection/datastore/Browserless/*"

# Compression — matches warrig.
borgmatic_compression: "zstd,10"

# Retention — matches warrig.
borgmatic_keep_daily: 7
borgmatic_keep_weekly: 4
borgmatic_keep_monthly: 6
borgmatic_keep_yearly: 1

# Consistency checks — matches warrig.
borgmatic_consistency_checks:
  - { name: data, frequency: "2 weeks" }
  - { name: extract, frequency: "1 month" }

# ntfy. Single topic [redacted-vaulted-topic]. Named priorities (default/urgent) per
# Cam's strategy-doc refactor note — no numeric -p N here.
borgmatic_ntfy_bin: /usr/bin/ntfy
borgmatic_ntfy_topic: [redacted-vaulted-topic]
borgmatic_ntfy_priority_start: min
borgmatic_ntfy_priority_ok: default
borgmatic_ntfy_priority_fail: urgent
# Degraded = a DB dump failed but the filesystem backup still ran. urgent, not
# high: a missing DB dump used to surface as a whole-backup failure (urgent,
# bypasses DND) and must not get quieter now that it degrades gracefully.
borgmatic_ntfy_priority_degraded: urgent

# DB dump staging dir. The before-create hook writes here; the after-create
# hook wipes it. 0700 root so dumps aren't world-readable while staged.
borgmatic_dump_dir: /var/backups/borgmatic-dumps

# Dump resilience: attempts per DB and seconds between attempts. A dump that
# fails all attempts alerts via ntfy but never aborts the filesystem backup.
# The test_<uuid> race is closed structurally by the table filter below, so
# the retry only covers brief container blips — hence few attempts, far apart.
borgmatic_dump_attempts: 2
borgmatic_dump_retry_delay: 30
# Split timeout. The INNER timeout(1) runs inside the container and is what
# actually bounds the dump; the OUTER one only kills the docker CLI and is a
# backstop against a wedged docker client. Outer MUST stay > inner, else the
# CLI is killed while the dump keeps running server-side and a retry stacks a
# second dump on the first. Worst-case before-hook stall is
# attempts x inner + retry_delay, per DB — keep the total clear of warrig's
# 04:00 push to the same gastown target.
borgmatic_dump_timeout_inner: 570
borgmatic_dump_timeout_outer: 600

# Databases to dump. The before-create hook iterates this list. Set to [] to
# skip DB dumping entirely.
#
# Per entry:
#   name             — also the DUMP-FAILED-<name>.txt marker suffix, and the
#                      key borgmatic-cleanup-dumps.sh asserts on (it expects
#                      "<name>-all.sql", so keep dump_file in that shape).
#   terminator       — string the tail of a complete dump must contain. This
#                      is what makes a truncated-but-exit-0 dump fail instead
#                      of being promoted.
#   dump_invocation  — the full command, rendered verbatim as the argv handed
#                      to the script's dump() helper. It references the shell
#                      vars $outer_timeout / $inner_timeout defined in the
#                      script from borgmatic_dump_timeout_{outer,inner}, so
#                      the split stays in one place. Outer wraps `docker`,
#                      inner runs inside the container.
borgmatic_databases:
  - name: windmill-postgres
    dump_file: "windmill-postgres-all.sql"
    # pg_dumpall's CLUSTER terminator, not the per-database one — see comment.
    terminator: "PostgreSQL database cluster dump complete"
    dump_comment: |-
      # Terminator note: pg_dumpall's CLUSTER terminator is used deliberately — the
      # per-database "PostgreSQL database dump complete" appears once per DB and
      # would still match a dump truncated between databases.
    dump_invocation: |-
      timeout "$outer_timeout" docker exec windmill-db-1 \
          timeout "$inner_timeout" pg_dumpall -U postgres

  - name: bunkerweb-mariadb
    dump_file: "bunkerweb-mariadb-all.sql"
    terminator: "Dump completed"
    # MYSQL_PASSWORD is in the container env (compose-injected). The table
    # list is enumerated live with BunkerWeb's ephemeral test tables (test_ +
    # exactly 32 hex chars, see bunkerweb db/Database.py uuid4().hex) filtered
    # out, so a test table created/dropped mid-dump is never referenced —
    # closes the Jun 25 / Jul 12 dump race structurally. The pattern is exact
    # so a future real test_* table would still be dumped. An empty list (SHOW
    # TABLES failed) falls through as a failure and gets retried.
    dump_comment: |-
      # $tables is deliberately unquoted below — mariadb-dump takes the table list
      # as separate argv entries, so word splitting is required. Safe here: the
      # schema is a fixed set of bw_* names with no spaces or glob characters.
    dump_invocation: |-
      timeout "$outer_timeout" docker exec bunkerweb-bw-db-1 sh -c \
          'tables=$(mariadb -ubunkerweb -p"$MYSQL_PASSWORD" -NBe "SHOW TABLES FROM db" | grep -Ev "^test_[0-9a-f]{32}$"); [ -n "$tables" ] && exec timeout '"$inner_timeout"' mariadb-dump -ubunkerweb -p"$MYSQL_PASSWORD" --single-transaction --quick db $tables'
  # No mongodb instance found on citadel as of 2026-05-13 survey. Add a
  # block here if/when mongo lands.
# Path to borg on the REMOTE (gastown) side. gastown's nux shell doesn't have
# /usr/local/bin on its non-interactive PATH, so borg needs to be invoked by
# absolute path. SynoCommunity borgbackup package symlinks borg here.
borgmatic_remote_path: /usr/local/bin/borg
