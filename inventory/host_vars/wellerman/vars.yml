ansible_become: true
# Canonical ansible_host for wellerman. Verified correct 2026-08-17; every
# inventory file that lists this host (raspberrypis, node_exporter,
# backup_targets) leaves ansible_host unset so this is the single source of
# truth under both `-i inventory/<file>` and `-i inventory/` directory mode.
ansible_host: 192.168.1.66

# --- compose stack tracking (roles/compose_stack) -------------------------
# Byte-faithful catalog of this host's running compose stacks. Generated from
# live captures 2026-08-19; secret values live in vault.yml alongside.
compose_stack_root: /home/pirate
compose_stacks:
  apprise-api:
    # compose-v1 relic: the running container was built by docker-compose
    # 1.29.2 and its Dockerfile no longer builds (python-dev is gone from the
    # base image), so a v2 `up` errors trying to produce the v2-named image.
    # Files are tracked; container state stays hand-managed until the
    # upstream Dockerfile is fixed and the stack is migrated to v2.
    reconcile: false
    files:
      - { src: wellerman/apprise-api/docker-compose.yml, dest: docker-compose.yml, mode: "0644" }
  portainer:
    files:
      - { src: wellerman/portainer/docker-compose.yml, dest: docker-compose.yml, mode: "0644" }
  wishthis:
    files:
      - { src: wellerman/wishthis/docker-compose.yml.j2, dest: docker-compose.yml, mode: "0640" }
      - { src: wellerman/wishthis/config.php.j2, dest: config.php, mode: "0640" }

# Secret passthroughs for compose_stack templates; values live in vault.yml.
wishthis_mariadb_password: "{{ vault_wishthis_mariadb_password }}"
wishthis_mariadb_root_password: "{{ vault_wishthis_mariadb_root_password }}"
