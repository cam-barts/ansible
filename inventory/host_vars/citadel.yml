---
ansible_become: true

# Read off the live host 2026-08-17; verified byte-equivalent to
# /etc/docker/daemon.json by the adversarial review pass. citadel IS the
# Loki host, so big batches (5000) and a longer timeout (3s) vs warrig.
docker_daemon_config:
  debug: true
  log-driver: loki
  log-opts:
    keep-file: "true"
    loki-batch-size: "5000"
    loki-max-backoff: 800ms
    loki-retries: "2"
    loki-timeout: 3s
    loki-url: http://citadel.shadeking.cam.local:3100/loki/api/v1/push
    mode: non-blocking

# cadvisor fold-in vars: inert until citadel joins [cadvisor:children].
# Values match the live container (roles/cadvisor/README.md): no published
# port, scraped by name over monitoring_default, 512m, no --docker_only.
cadvisor_memory: "512m"
cadvisor_docker_only: false
cadvisor_publish_port: false
cadvisor_networks:
  - name: monitoring_default
