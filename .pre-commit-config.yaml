---
# Run on every commit:  prek install   (or pre-commit install)
# Run across full repo:  prek run --all-files
#
# Scope: secret prevention + basic file hygiene + ansible-lint.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(roles/.+/templates/|.+\.j2$|inventory/group_vars/.+/vault\.yml$)
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
