---
# Run on every commit:  prek install   (or pre-commit install)
# Run across full repo:  prek run --all-files
#
# Scope: secret prevention + basic file hygiene + ansible-lint.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(roles/.+/templates/|.+\.j2$|inventory/(group|host)_vars/.+/vault\.yml$)
      - id: check-merge-conflict
      # No exclusions. roles/bunkerweb_stack's template used to need one: it is
      # a byte-faithful copy of citadel's live compose file, which carried
      # trailing whitespace on two lines plus a trailing blank line, and these
      # two hooks would have silently stripped them and broken the byte match.
      # The whitespace has since been removed from the live file instead, which
      # was verified config-inert (all seven compose config-hashes unchanged),
      # so the copy is faithful AND hook-clean. Keep it that way: re-adding an
      # exclude here is a sign the live file drifted back.
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
